services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocare
      POSTGRES_PASSWORD: vocare
      POSTGRES_DB: vocare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocare -d vocare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
