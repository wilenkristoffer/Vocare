name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vocare
          POSTGRES_PASSWORD: vocare
          POSTGRES_DB: vocare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocare -d vocare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests (no external services)
        run: pytest -v

      - name: Integration tests (real Postgres+pgvector)
        env:
          RUN_INTEGRATION: "1"
          DATABASE_URL: postgresql+asyncpg://vocare:vocare@localhost:5432/vocare
        run: pytest -v -m integration
