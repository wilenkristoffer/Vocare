[project]
name = "vocare"
version = "0.1.0"
description = "Standalone voice AI assistant: Gemini Live API + RAG (Postgres/pgvector) + MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "mcp>=2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
vocare = "vocare.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocare = ["knowledge_base/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres+pgvector (docker compose up db)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
